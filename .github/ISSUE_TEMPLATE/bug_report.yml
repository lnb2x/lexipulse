name: Bug report
description: Report a reproducible problem in LexiPulse.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private backups, or personal data. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser/version, Node version if local, and dev/preview/deployed setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove keys and personal data before attaching evidence.
